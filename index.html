<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F1E7" />
    <meta name="description" content="Saver: link, breadcrumb, key, authenticator, catatan, task mingguan, temp, dan papan kerja dalam satu aplikasi." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Saver" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/icon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preload" href="./fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
    <title>Saver</title>
    <script>
      (function () {
        var mode = "system"
        try { mode = localStorage.getItem("saver_theme") || "system" } catch (e) {}
        var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.dataset.theme = dark ? "dark" : "light"
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute("content", dark ? "#131417" : "#F6F1E7")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Saver membutuhkan JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
